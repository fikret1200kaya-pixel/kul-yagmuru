name: APK
on:
  push:
    branches: [claude/cloud-is4ttx, main]
    paths: ['game/**', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Oyunu uygulamaya kopyala
        run: |
          mkdir -p android/app/src/main/assets
          cp -r game android/app/src/main/assets/game
      - name: APK üret
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Dosya adı
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KulYagmuru.apk
      - uses: actions/upload-artifact@v4
        with: { name: KulYagmuru-apk, path: KulYagmuru.apk }
      - name: İndirme sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-son
          name: Kül Yağmuru (son test sürümü)
          prerelease: true
          files: KulYagmuru.apk
          body: Telefona indirip kurun. Bilinmeyen kaynaklardan yüklemeye izin vermeniz gerekebilir.
