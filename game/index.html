<style>
  :root { color-scheme: dark; --ash:#0e0d0c; --bone:#e9e2d4; --dim:#9b9387; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ash); color: var(--bone); overflow: hidden;
         font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--ash); }
  canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; }
  #rot { position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px);
         text-align: center; font-size: 18px; color: var(--dim); letter-spacing: .04em; pointer-events: none; }
</style>
</head>
<body>

<div id="wrap"><canvas id="c" width="1280" height="720" aria-label="Kül Yağmuru oyun ekranı"></canvas></div>
<div id="rot" hidden>Daha rahat oynamak için telefonu yan çevir</div>

<script>
(() => {
const C = document.getElementById('c'), X = C.getContext('2d'), rot = document.getElementById('rot');

function fit() {
  const w = innerWidth, h = innerHeight; let cw = w, ch = w * 9 / 16;
  if (ch > h) { ch = h; cw = h * 16 / 9; }
  C.style.width = cw + 'px'; C.style.height = ch + 'px'; rot.hidden = !(h > w);

addEventListener('resize', fit); fit();

// ---------- assets ----------
const SRC = {
  bg_pa:'img/bg_pa.jpg', bg_pb:'img/bg_pb.jpg', plate:'img/plate.png', patch_plate:'img/patch_plate.png',
  patch_boru:'img/patch_boru.png', patch_tugla:'img/patch_tugla.png', it_boru:'img/it_boru.png',
  it_tugla:'img/it_tugla.png', it_kol:'img/it_kol.png', l1:'img/lehim_1.png', l1t:'img/lehim_1_tekkol.png',
  l3:'img/lehim_3.png', l5:'img/lehim_5.png', b2:'img/bahcivan_2.png', b3:'img/bahcivan_3.png',
  b4:'img/bahcivan_4.png',
  bg_1a:'img/bg_1a.jpg', bg_1b:'img/bg_1b.jpg', bg_1c:'img/bg_1c.jpg', bg_1d:'img/bg_1d.jpg',
  cu_saat:'img/cu_saat.jpg', cu_tarife:'img/cu_tarife.jpg', cu_makas:'img/cu_makas.jpg', cu_bilet:'img/cu_bilet.jpg',
  cu_hafiza1:'img/cu_hafiza1.jpg', cin_filiz:'img/cin_filiz.jpg',
  ...(() => { const o = {}; [['duduk', 4], ['giseci', 3], ['kedi', 4], ['guvercin', 3]].forEach(([n, c]) => { for (let i = 1; i <= c; i++) o[n + i] = 'img/' + n + '_' + i + '.png'; }); return o; })(),
  sd_head:'img/side_head.png', sd_body:'img/side_body.png', sd_armN:'img/side_armN.png', sd_armF:'img/side_armF.png', sd_legN:'img/side_legN.png', sd_legF:'img/side_legF.png', sd_scarf:'img/side_scarf.png', ...(() => { const o = {}; ['head','body','armL','armR','scarf','legL','legR'].forEach(p => { o['rA_' + p] = 'img/rig_lehim_1_' + p + '.png'; if (p !== 'armR') o['rB_' + p] = 'img/rig_lehim_1_tekkol_' + p + '.png'; }); return o; })(), avuc:'img/cin_avuc.jpg', kapak:'img/cin_kapak.jpg', b5:'img/b5_panel.jpg', lever:'img/lever.png'
};
const IMG = {}, GRAY = {};
function gray(img, tint = 0.10) {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const l = p[i] * .3 + p[i+1] * .59 + p[i+2] * .11;
    p[i] = l * (1 - tint) + 118 * tint; p[i+1] = l * (1 - tint) + 110 * tint; p[i+2] = l * (1 - tint) + 98 * tint;
  }
  g.putImageData(d, 0, 0); return c;
}
function canvasOf(img) { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').drawImage(img, 0, 0); return c; }

// ---------- audio ----------
let AC = null, wind = null;
function audioStart() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    if (wind) return;
    const len = AC.sampleRate * 3, buf = AC.createBuffer(1, len, AC.sampleRate), ch = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++) { last = (last + (Math.random() * 2 - 1) * .02) * .998; ch[i] = last * 6; }
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    const gn = AC.createGain(); gn.gain.value = .18;
    src.connect(f).connect(gn).connect(AC.destination); src.start(); wind = gn;
  } catch (e) {}
}
function tone(freq, t0, dur, vol = .12, type = 'sine') {
  if (!AC) return; const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq; const t = AC.currentTime + t0;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0005, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .05);
}
function clank() { if (!AC) return; tone(180 + Math.random() * 60, 0, .18, .08, 'square'); tone(90, 0, .25, .06, 'triangle'); }
function chime() { [659, 784, 880].forEach((f, i) => tone(f, i * .12, .9, .08)); }
const THEME = [659.3, 784, 880, 987.8, 1318.5];
function musicBox() { THEME.forEach((f, i) => { tone(f, i * .42, 1.6, .07); tone(f * 2, i * .42, .6, .015); }); }
function bad() { tone(140, 0, .25, .08, 'sawtooth'); tone(110, .1, .3, .06, 'sawtooth'); }
// sustained note with a soft attack and release (steam whistle, drezin horn)
function held(freq, t0, dur, vol, type = 'triangle') {
  if (!AC) return; const o = AC.createOscillator(), g = AC.createGain(), v = AC.createOscillator(), vg = AC.createGain();
  const t = AC.currentTime + t0; o.type = type; o.frequency.value = freq;
  v.frequency.value = 6; vg.gain.value = freq * .012; v.connect(vg).connect(o.frequency);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .03); g.gain.setValueAtTime(vol, t + dur - .05); g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); v.start(t); o.stop(t + dur + .05); v.stop(t + dur + .05);
}
// Düdük's rhythm: 0 = short, 1 = long
const RIT = [0, 0, 1, 0], RIT_LEN = [.16, .6];
function whistle(vol = .07, pat = RIT) {
  let t = 0; pat.forEach(b => { const d = RIT_LEN[b]; held(1175, t, d, vol); held(1568, t, d, vol * .5); t += d + .16; }); return t;
}
function bell() { [0, .7, 1.4].forEach(t => { tone(523, t, 1.6, .09); tone(1046, t, .8, .03); tone(784, t + .02, 1.2, .04); }); }
function purr() { for (let i = 0; i < 6; i++) tone(55 + (i % 2) * 6, i * .22, .2, .05, 'sawtooth'); }
let horn = null;
function hornStart() {
  if (!AC || horn) return; const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = 392;
  g.gain.setValueAtTime(0, AC.currentTime); g.gain.linearRampToValueAtTime(.08, AC.currentTime + .03); o.connect(g).connect(AC.destination); o.start(); horn = { o, g };
}
function hornStop() { if (!horn) return; const { o, g } = horn, t = AC.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + .05); o.stop(t + .08); horn = null; }

// ---------- state ----------
const S = {

  inv: [], f: {}, halos: { pa: [], pb: [] }, bubble: null, hint: null, overlay: null, cin: null, fade: 0, fadeTarget: 0,

};

const BG = {};
let colorLayer = null, colorDirty = true, maskC = null;

function stamp(scene, key, x, y) {
  BG[scene].col.getContext('2d').drawImage(IMG[key], x, y);
  BG[scene].gry.getContext('2d').drawImage(gray(IMG[key]), x, y);

}
function halo(x, y, r) { (S.halos[S.scene] = S.halos[S.scene] || []).push({ x, y, r, t: 0 }); colorDirty = true; S.isik++; chime(); }

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const inRect = (p, r) => p.x >= r[0] && p.x <= r[0] + r[2] && p.y >= r[1] && p.y <= r[1] + r[3];
// at: optional [x, y] anchor for a bubble over someone other than Lehim
function say(icons, dur = 2.6, at = null) { S.bubble = { icons, t: dur, max: dur, at }; }
function addItem(id) { if (!S.inv.includes(id)) S.inv.push(id); clank(); }
function takeItem(id) { S.inv = S.inv.filter(i => i !== id); }
// walkable floor per scene: x range, y range, and Lehim's scale at the far and near edge
const GEO = {
  pa: { x: [140, 1085], y: [458, 700], s: [.82, .38] }, pb: { x: [250, 1180], y: [505, 690], s: [.82, .34] },
  '1a': { x: [285, 1000], y: [566, 700], s: [.78, .3] }, '1b': { x: [245, 1030], y: [596, 705], s: [.84, .3] },
  '1c': { x: [130, 1150], y: [572, 705], s: [.78, .32] }, '1d': { x: [330, 1040], y: [578, 705], s: [.84, .34] }
};
function walkBounds(x, y) { const g = GEO[S.scene]; return { x: clamp(x, g.x[0], g.x[1]), y: clamp(y, g.y[0], g.y[1]) }; }
function scaleAt(y) { const g = GEO[S.scene]; return g.s[0] + g.s[1] * (y - g.y[0]) / (g.y[1] - g.y[0]); }
function walkTo(x, y, then) {
  const p = walkBounds(x, y); L.tx = p.x; L.ty = p.y; L.then = then || null;
  if (Math.hypot(L.tx - L.x, L.ty - L.y) < 4) { L.moving = false; const t = L.then; L.then = null; t && t(); return; }
  L.moving = true; L.face = L.tx >= L.x ? 1 : -1;
}
function play(anim, dur, then) { L.anim = anim; L.animT = dur; L.animMax = dur; L.animThen = then || null; }
function lehimBox() { const s = scaleAt(L.y), h = 190 * s, w = h * .9; return [L.x - w / 2, L.y - h, w, h]; }

// ---------- scenes ----------
const HS = {

    { id: 'makas', r: [495, 455, 70, 45], stand: [520, 560], on: () => S.f.makasOut && !S.f.makasTaken, tap() { S.f.makasTaken = 1; addItem('makas'); } },

  pb: [
    { id: 'pit', r: [140, 470, 240, 150], stand: [330, 565], tap() { S.f.pitSeen = 1; S.overlay = { type: 'pit', t: 0 }; } },
    { id: 'panel', r: [1035, 245, 190, 205], stand: [1110, 530], on: () => !S.f.gateOpen, tap() {

    { id: 'gate', r: [600, 120, 340, 370], stand: [770, 520], tap() {

  ]

// spawn: [x, y] where Lehim appears in the new scene
function goScene(id, spawn) {
  S.fadeTarget = 1; S.hint = null;
  setTimeout(() => {
    S.scene = id; colorDirty = true; L.alpha = 1; L.anim = null; L.moving = false; L.then = null;
    if (id === 'pb') spawn = [330, 610];
    if (spawn) { L.x = spawn[0]; L.y = spawn[1]; L.tx = L.x; L.ty = L.y; }
    S.fadeTarget = 0; ENTER[id] && ENTER[id]();
  }, 600);
}

const COMBO = { 'miknatis+tel': 'olta' };

const SAAT_HEDEF = [4, 10];
// switch panel: 3x3 tiles, bits N=1 E=2 S=4 W=8; path enters row 2 from the west, leaves row 0 to the east
const MK = { base: { I: 5, L: 3 }, types: ['I', 'L', 'L', 'L', 'I', 'L', 'L', 'I', 'L'], rot0: [1, 2, 3, 0, 0, 2, 1, 0, 1] };
const rotMask = (m, r) => { for (let i = 0; i < r; i++) m = ((m << 1) | (m >> 3)) & 15; return m; };

function saveProgress() { try { localStorage.setItem('ky_bolum', JSON.stringify({ bolum: 1, cark: S.cark, isik: S.isik, canlilik: S.canlilik })); } catch (e) {} }
function startBolum1(fromSave) {
  if (fromSave) { try { const s = JSON.parse(localStorage.getItem('ky_bolum') || '{}'); S.cark = s.cark || 0; S.isik = s.isik || 0; S.canlilik = s.canlilik || 4; } catch (e) {} }
  S.bolum = 1; S.f = { mk: MK.rot0.slice() }; S.inv = ['dal']; S.overlay = null; S.bubble = null; S.hint = null;
  L.arm = true; L.alpha = 1; L.anim = null; L.moving = false; L.then = null; L.face = 1;
  S.scene = '1a'; L.x = L.tx = 330; L.y = L.ty = 640; colorDirty = true;
  saveProgress(); S.mode = 'card'; S.card = { t: 0 }; S.fade = 0; S.fadeTarget = 0;
}
function clockRing() {
  S.f.saat = 1; bell(); halo(317, 220, 300);
  setTimeout(() => { S.f.duduk = 'cold'; whistle(.03); say(['duduk', 'unlem'], 3); }, 2600);
}

  setTimeout(() => { f.dudukGone = 1; say(['duduk', 'ray'], 2.6); }, 4200);
}
function seedDrain() { S.canlilik = Math.max(0, S.canlilik - 1); S.f.drain = 1.6; tone(330, 0, .8, .06); tone(247, .3, 1, .05); }
function inspect(id) {
  if (id === 'bilet') { S.overlay = { type: 'bilet', t: 0 }; return; }
  if (id === 'afis') { S.overlay = { type: 'tarife', t: 0, piece: true }; return; }
  if (id === 'olta') { say(['olta', 'disli']); return; }
  if (id === 'dal') { say(['kubbe']); return; }
  say([id, 'soru'], 1.6);
}

      if (S.f.saat) { say(['saat', 'duduk']); return; }

  { id: 'hopar', r: [245, 210, 130, 120], stand: [330, 600], on: () => !S.f.miknatis, tap() {
      S.f.miknatis = 1; S.f.hoparT = 0; clank(); setTimeout(() => { clank(); addItem('miknatis'); }, 500); } },
