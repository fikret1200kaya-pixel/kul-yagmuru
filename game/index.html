<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kül Yağmuru Prolog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&display=swap">
<style>
  :root { color-scheme: dark; --ash:#0e0d0c; --bone:#e9e2d4; --dim:#9b9387; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ash); color: var(--bone); overflow: hidden;
         font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--ash); }
  canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; }
  #rot { position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px);
         text-align: center; font-size: 18px; color: var(--dim); letter-spacing: .04em; pointer-events: none; }
</style>
</head>
<body>

<div id="wrap"><canvas id="c" width="1280" height="720" aria-label="Kül Yağmuru oyun ekranı"></canvas></div>
<div id="rot" hidden>Daha rahat oynamak için telefonu yan çevir</div>

<script>
(() => {
const C = document.getElementById('c'), X = C.getContext('2d'), rot = document.getElementById('rot');
const W = 1280, H = 720;
function fit() {
  const w = innerWidth, h = innerHeight; let cw = w, ch = w * 9 / 16;
  if (ch > h) { ch = h; cw = h * 16 / 9; }
  C.style.width = cw + 'px'; C.style.height = ch + 'px'; rot.hidden = !(h > w);
}
addEventListener('resize', fit); fit();

// ---------- assets ----------
const SRC = {
  bg_pa:'img/bg_pa.jpg', bg_pb:'img/bg_pb.jpg', plate:'img/plate.png', patch_plate:'img/patch_plate.png',
  patch_boru:'img/patch_boru.png', patch_tugla:'img/patch_tugla.png', it_boru:'img/it_boru.png',
  it_tugla:'img/it_tugla.png', it_kol:'img/it_kol.png', l1:'img/lehim_1.png', l1t:'img/lehim_1_tekkol.png',
  l3:'img/lehim_3.png', l5:'img/lehim_5.png', b2:'img/bahcivan_2.png', b3:'img/bahcivan_3.png',
  b4:'img/bahcivan_4.png', sd_head:'img/side_head.png', sd_body:'img/side_body.png', sd_armN:'img/side_armN.png', sd_armF:'img/side_armF.png', sd_legN:'img/side_legN.png', sd_legF:'img/side_legF.png', sd_scarf:'img/side_scarf.png', ...(() => { const o = {}; ['head','body','armL','armR','scarf','legL','legR'].forEach(p => { o['rA_' + p] = 'img/rig_lehim_1_' + p + '.png'; if (p !== 'armR') o['rB_' + p] = 'img/rig_lehim_1_tekkol_' + p + '.png'; }); return o; })(), avuc:'img/cin_avuc.jpg', kapak:'img/cin_kapak.jpg', b5:'img/b5_panel.jpg', lever:'img/lever.png'
};
const IMG = {}, GRAY = {};
function gray(img, tint = 0.10) {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const l = p[i] * .3 + p[i+1] * .59 + p[i+2] * .11;
    p[i] = l * (1 - tint) + 118 * tint; p[i+1] = l * (1 - tint) + 110 * tint; p[i+2] = l * (1 - tint) + 98 * tint;
  }
  g.putImageData(d, 0, 0); return c;
}
function canvasOf(img) { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').drawImage(img, 0, 0); return c; }

// ---------- audio ----------
let AC = null, wind = null;
function audioStart() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    if (wind) return;
    const len = AC.sampleRate * 3, buf = AC.createBuffer(1, len, AC.sampleRate), ch = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++) { last = (last + (Math.random() * 2 - 1) * .02) * .998; ch[i] = last * 6; }
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    const gn = AC.createGain(); gn.gain.value = .18;
    src.connect(f).connect(gn).connect(AC.destination); src.start(); wind = gn;
  } catch (e) {}
}
function tone(freq, t0, dur, vol = .12, type = 'sine') {
  if (!AC) return; const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq; const t = AC.currentTime + t0;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0005, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .05);
}
function clank() { if (!AC) return; tone(180 + Math.random() * 60, 0, .18, .08, 'square'); tone(90, 0, .25, .06, 'triangle'); }
function chime() { [659, 784, 880].forEach((f, i) => tone(f, i * .12, .9, .08)); }
const THEME = [659.3, 784, 880, 987.8, 1318.5];
function musicBox() { THEME.forEach((f, i) => { tone(f, i * .42, 1.6, .07); tone(f * 2, i * .42, .6, .015); }); }
function bad() { tone(140, 0, .25, .08, 'sawtooth'); tone(110, .1, .3, .06, 'sawtooth'); }

// ---------- state ----------
const S = {
  mode: 'loading', t: 0, scene: 'pa', isik: 0, cark: 0, canlilik: 4,
  inv: [], f: {}, halos: { pa: [], pb: [] }, bubble: null, hint: null, overlay: null, cin: null, fade: 0, fadeTarget: 0
};
const L = { x: 560, y: 600, tx: 560, ty: 600, face: 1, moving: false, arm: false, anim: null, animT: 0, then: null, alpha: 1 };
const BG = {};
let colorLayer = null, colorDirty = true, maskC = null;

function stamp(scene, key, x, y) {
  BG[scene].col.getContext('2d').drawImage(IMG[key], x, y);
  BG[scene].gry.getContext('2d').drawImage(gray(IMG[key]), x, y);
  colorDirty = true;
}
function halo(x, y, r) { S.halos[S.scene].push({ x, y, r, t: 0 }); colorDirty = true; S.isik++; chime(); }

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const inRect = (p, r) => p.x >= r[0] && p.x <= r[0] + r[2] && p.y >= r[1] && p.y <= r[1] + r[3];
function say(icons, dur = 2.6) { S.bubble = { icons, t: dur, max: dur }; }
function addItem(id) { if (!S.inv.includes(id)) S.inv.push(id); clank(); }
function takeItem(id) { S.inv = S.inv.filter(i => i !== id); }
function walkBounds(x, y) {
  return S.scene === 'pa' ? { x: clamp(x, 140, 1085), y: clamp(y, 458, 700) } : { x: clamp(x, 250, 1180), y: clamp(y, 505, 690) };
}
function scaleAt(y) { return S.scene === 'pa' ? .82 + .38 * (y - 458) / 242 : .82 + .34 * (y - 505) / 185; }
function walkTo(x, y, then) {
  const p = walkBounds(x, y); L.tx = p.x; L.ty = p.y; L.then = then || null;
  if (Math.hypot(L.tx - L.x, L.ty - L.y) < 4) { L.moving = false; const t = L.then; L.then = null; t && t(); return; }
  L.moving = true; L.face = L.tx >= L.x ? 1 : -1;
}
function play(anim, dur, then) { L.anim = anim; L.animT = dur; L.animMax = dur; L.animThen = then || null; }
function lehimBox() { const s = scaleAt(L.y), h = 190 * s, w = h * .9; return [L.x - w / 2, L.y - h, w, h]; }

// ---------- scenes ----------
const HS = {
  pa: [
    { id: 'bahcivan', r: [90, 110, 250, 330], stand: [335, 485], tap() {
        S.f.bahPoint = 3; say(['kubbe']); setTimeout(() => { if (!L.arm) say(['kol', 'soru']); }, 2800); } },
    { id: 'boru', r: [222, 532, 128, 66], stand: [290, 612], on: () => !S.f.boru, tap() {
        S.f.boru = 1; stamp('pa', 'patch_boru', 214, 524); addItem('boru'); } },
    { id: 'tugla', r: [22, 560, 116, 76], stand: [160, 640], on: () => !S.f.tugla, tap() {
        S.f.tugla = 1; stamp('pa', 'patch_tugla', 14, 552); addItem('tugla'); } },
    { id: 'plate', r: [205, 428, 460, 96], stand: [440, 562], on: () => !S.f.lifted, tap() {
        if (!L.arm) { play('strain', 1.2); say(['kol', 'x']); } else say(['ucgen', 'soru']); },
      use: {
        tugla() { S.f.brick = 1; takeItem('tugla'); clank(); },
        boru() {
          if (!S.f.brick) { play('strain', 1); say(['ucgen', 'soru']); return; }
          S.f.lifted = 1; S.f.liftT = 0; stamp('pa', 'patch_plate', 188, 413); clank();
          setTimeout(() => { S.f.kolOut = 1; S.f.makasOut = 1; halo(430, 480, 260); }, 900);
        } } },
    { id: 'kol', r: [370, 450, 90, 55], stand: [420, 560], on: () => S.f.kolOut && !S.f.kolTaken, tap() { S.f.kolTaken = 1; addItem('kol'); } },
    { id: 'makas', r: [495, 455, 70, 45], stand: [520, 560], on: () => S.f.makasOut && !S.f.makasTaken, tap() { S.f.makasTaken = 1; addItem('makas'); } },
    { id: 'corner', r: [1085, 470, 195, 250], stand: [1060, 650], on: () => !S.f.cornerLit, tap() { say(['goz', 'karanlik']); if (S.f.loose) S.f.teach = 2.4; },
      light() { S.f.cornerLit = 1; S.f.litT = 0; tone(523, 0, 1.2, .06); tone(784, .15, 1.2, .05); } },
    { id: 'vida', r: [1100, 585, 70, 55], stand: [1060, 650], on: () => S.f.cornerLit && !S.f.vidaTaken, tap() { S.f.vidaTaken = 1; addItem('vida'); } },
    { id: 'cark', r: [1165, 630, 70, 60], stand: [1060, 660], on: () => S.f.cornerLit && !S.f.carkTaken, tap() { S.f.carkTaken = 1; S.cark++; chime(); } },
    { id: 'kapak47', r: [868, 492, 204, 66], stand: [960, 600], tap() { play('shrug', 1.4); say(['kapak', 'soru']); } },
    { id: 'ladder', r: [1040, 30, 150, 440], stand: [1075, 470], tap() {
        if (!L.arm) { play('slip', 1.1); say(['kol', 'x']); return; }
        if (!S.f.fixed) { say(['kapak', 'unlem']); return; }
        play('climb', 1.6, () => goScene('pb')); } }
  ],
  pb: [
    { id: 'pit', r: [140, 470, 240, 150], stand: [330, 565], tap() { S.f.pitSeen = 1; S.overlay = { type: 'pit', t: 0 }; } },
    { id: 'panel', r: [1035, 245, 190, 205], stand: [1110, 530], on: () => !S.f.gateOpen, tap() {
        S.overlay = { type: 'panel', t: 0, seq: [], lev: [0, 0, 0], lock: false, solved: false }; } },
    { id: 'gate', r: [600, 120, 340, 370], stand: [770, 520], tap() {
        if (!S.f.gateOpen) { play('strain', 1); say(['kilit']); return; }
        if (!S.f.farewell) return;
        walkTo(770, 505, () => play('leave', 2.2, () => { S.mode = 'end'; S.t = 0; musicBox(); })); } }
  ]
};

function goScene(id) {
  S.fadeTarget = 1;
  setTimeout(() => {
    S.scene = id; colorDirty = true; L.alpha = 1;
    if (id === 'pb') { L.x = 330; L.y = 610; L.tx = L.x; L.ty = L.y; L.anim = null; }
    S.fadeTarget = 0;
  }, 600);
}

// ---------- icons for thought bubbles ----------
function icon(name, x, y, s) {
  const g = X; g.save(); g.translate(x, y); g.scale(s / 40, s / 40);
  g.lineWidth = 3.2; g.strokeStyle = '#2b2520'; g.fillStyle = '#2b2520'; g.lineCap = 'round'; g.lineJoin = 'round'; g.shadowColor = 'rgba(70,48,24,.16)'; g.shadowBlur = 1.5;
  const P = new Path2D();
  switch (name) {
    case 'kubbe': g.beginPath(); g.arc(0, 8, 16, Math.PI, 0); g.stroke(); g.beginPath(); g.moveTo(-16, 8); g.lineTo(16, 8); g.stroke();
      [-8, 0, 8].forEach(v => { g.beginPath(); g.moveTo(v, 8); g.lineTo(v * .6, -8 + Math.abs(v) * .3); g.stroke(); }); break;
    case 'kol': g.beginPath(); g.moveTo(-14, -12); g.lineTo(-2, 0); g.lineTo(12, 4); g.stroke();
      [[-14, -12], [-2, 0], [12, 4]].forEach(([a, b]) => { g.beginPath(); g.arc(a, b, 3.5, 0, 7); g.fill(); });
      g.beginPath(); g.moveTo(12, 4); g.lineTo(18, 0); g.moveTo(12, 4); g.lineTo(18, 8); g.stroke(); break;
    case 'x': g.strokeStyle = '#8a2a1c'; g.lineWidth = 4; g.beginPath(); g.moveTo(-10, -10); g.lineTo(10, 10); g.moveTo(10, -10); g.lineTo(-10, 10); g.stroke(); break;
    case 'ucgen': g.beginPath(); g.moveTo(0, -12); g.lineTo(13, 10); g.lineTo(-13, 10); g.closePath(); g.stroke();
      g.beginPath(); g.moveTo(-18, -14); g.lineTo(18, -4); g.stroke(); break;
    case 'soru': case 'unlem': g.font = '700 34px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(name === 'soru' ? '?' : '!', 0, 2); break;
    case 'vida': g.beginPath(); g.moveTo(-9, -12); g.lineTo(9, -12); g.stroke(); g.beginPath(); g.moveTo(0, -12); g.lineTo(0, 14); g.stroke();
      for (let i = -6; i < 12; i += 5) { g.beginPath(); g.moveTo(-5, i); g.lineTo(5, i + 3); g.stroke(); } break;
    case 'makas': g.beginPath(); g.moveTo(-14, 12); g.lineTo(10, -12); g.lineTo(14, -8); g.lineTo(-10, 16); g.closePath(); g.stroke(); break;
    case 'goz': g.beginPath(); g.ellipse(0, 0, 16, 10, 0, 0, 7); g.stroke(); g.beginPath(); g.arc(0, 0, 5, 0, 7); g.fill(); break;
    case 'karanlik': g.beginPath(); g.arc(0, 0, 14, 0, 7); g.fill(); break;
    case 'kapak': g.beginPath(); g.arc(0, 0, 13, 0, 7); g.stroke(); g.beginPath(); g.arc(0, 0, 7, 0, 7); g.stroke(); g.fillRect(-17, -3, 5, 6); break;
    case 'kilit': g.beginPath(); g.rect(-11, -2, 22, 17); g.stroke(); g.beginPath(); g.arc(0, -2, 8, Math.PI, 0); g.stroke(); break;
  }
  g.restore();
}
function drawBubble() {
  const b = S.bubble; if (!b) return;
  const a = Math.min(1, b.t * 3, (b.max - b.t) * 6), box = lehimBox();
  const n = b.icons.length, w = 20 + n * 46, h = 62, x = clamp(L.x - w / 2 + 40, 10, W - w - 10), y = Math.max(10, box[1] - h - 30);
  X.save(); X.globalAlpha = a;
  X.fillStyle = 'rgba(236,228,212,.95)'; X.strokeStyle = 'rgba(60,50,40,.9)'; X.lineWidth = 2;
  X.beginPath(); X.roundRect(x, y, w, h, 26); X.fill(); X.stroke();
  [[L.x + 6, y + h + 10, 7], [L.x - 4, y + h + 24, 4.5]].forEach(([cx, cy, r]) => { X.beginPath(); X.arc(cx, cy, r, 0, 7); X.fill(); X.stroke(); });
  b.icons.forEach((ic, i) => icon(ic, x + 33 + i * 46, y + h / 2, 34));
  X.restore();
}

// ---------- inventory ----------
const SLOT = { x: 712, y: 10, s: 78, gap: 8 };
function slotRect(i) { return [SLOT.x + i * (SLOT.s + SLOT.gap), SLOT.y, SLOT.s, SLOT.s]; }
function drawItem(id, cx, cy, size) {
  const im = { boru: 'it_boru', tugla: 'it_tugla', kol: 'it_kol' }[id];
  if (im) { const g = GRAY[im], k = size / Math.max(g.width, g.height); X.drawImage(g, cx - g.width * k / 2, cy - g.height * k / 2, g.width * k, g.height * k); return; }
  X.save(); X.translate(cx, cy); X.strokeStyle = '#cfc6b6'; X.fillStyle = '#cfc6b6'; X.lineWidth = 3; X.lineCap = 'round';
  if (id === 'vida') { X.beginPath(); X.moveTo(-9, -14); X.lineTo(9, -14); X.moveTo(0, -14); X.lineTo(0, 16); X.stroke(); for (let i = -8; i < 14; i += 5) { X.beginPath(); X.moveTo(-5, i); X.lineTo(5, i + 3); X.stroke(); } }
  if (id === 'makas') { X.fillStyle = '#9d968a'; X.beginPath(); X.moveTo(-18, 14); X.lineTo(12, -16); X.lineTo(17, -11); X.lineTo(-13, 19); X.closePath(); X.fill(); X.stroke(); }
  if (id === 'dal') { X.strokeStyle = '#a58a6a'; X.beginPath(); X.moveTo(-18, 16); X.quadraticCurveTo(-2, 2, 16, -16); X.moveTo(-4, 4); X.lineTo(-12, -8); X.moveTo(6, -6); X.lineTo(14, 2); X.stroke(); }
  X.restore();
}
function drawInv() {
  // notebook (hint) + counters
  X.save(); X.fillStyle = 'rgba(20,18,16,.55)'; X.beginPath(); X.roundRect(10, 10, 78, 78, 14); X.fill();
  X.strokeStyle = '#d8cfbf'; X.lineWidth = 2.5; X.strokeRect(31, 26, 36, 46); X.beginPath(); X.moveTo(38, 26); X.lineTo(38, 72); X.stroke();
  X.beginPath(); X.moveTo(44, 40); X.lineTo(60, 40); X.moveTo(44, 50); X.lineTo(58, 50); X.stroke();
  X.font = '700 22px "Cormorant Garamond", Georgia, serif'; X.fillStyle = '#d8cfbf'; X.textBaseline = 'middle';
  gear(114, 49, 13, '#d8cfbf'); X.fillText('×' + S.cark, 132, 50);
  X.fillStyle = 'rgba(160,215,120,.95)'; X.beginPath(); X.arc(190, 49, 7 + Math.sin(S.t * 3) * 1.2, 0, 7); X.fill(); X.fillStyle = '#d8cfbf'; X.fillText('×' + S.isik, 204, 50);
  for (let i = 0; i < 6; i++) {
    const r = slotRect(i); X.fillStyle = 'rgba(20,18,16,.5)'; X.beginPath(); X.roundRect(r[0], r[1], r[2], r[3], 12); X.fill();
    X.strokeStyle = 'rgba(216,207,191,.25)'; X.lineWidth = 1.5; X.stroke();
    const id = S.inv[i]; if (id && !(drag && drag.item === id)) drawItem(id, r[0] + r[2] / 2, r[1] + r[3] / 2, 58);
  }
  X.restore();
}
function gear(cx, cy, r, col) {
  // Beveled brass gear ring; an even-odd hole keeps the painted scene intact.
  X.save(); X.translate(Math.round(cx) + .5, Math.round(cy) + .5);
  const teeth = 12, step = Math.PI * 2 / teeth, outer = r, root = r * .78;
  X.beginPath();
  for (let i = 0; i < teeth; i++) {
    const a = i * step - step * .5;
    [[a, root], [a + step * .18, root], [a + step * .27, outer], [a + step * .73, outer], [a + step * .82, root], [a + step, root]]
      .forEach(([ang, rad], j) => { const px = Math.cos(ang) * rad, py = Math.sin(ang) * rad; if (!i && !j) X.moveTo(px, py); else X.lineTo(px, py); });
  }
  X.closePath(); X.arc(0, 0, r * .38, 0, Math.PI * 2, true);
  const grad = X.createLinearGradient(-r, -r, r, r); grad.addColorStop(0, '#f0d69b'); grad.addColorStop(.45, col); grad.addColorStop(1, '#80633d');
  X.fillStyle = grad; X.fill('evenodd'); X.strokeStyle = 'rgba(45,34,24,.9)'; X.lineWidth = Math.max(1, r * .09); X.stroke();
  X.beginPath(); X.arc(0, 0, r * .38, 0, Math.PI * 2); X.strokeStyle = 'rgba(248,226,174,.9)'; X.lineWidth = Math.max(1, r * .08); X.stroke();
  X.beginPath(); X.arc(0, 0, Math.max(1.3, r * .11), 0, Math.PI * 2); X.fillStyle = 'rgba(50,39,29,.9)'; X.fill(); X.restore();
}

// ---------- hints ----------
function currentHint() {
  const f = S.f;
  if (S.scene === 'pa') {
    if (!f.boru) return 'boru'; if (!f.tugla) return 'tugla';
    if (!f.lifted) return 'plate'; if (!f.kolTaken) return 'kol'; if (!L.arm) return 'lehim';
    if (!f.makasTaken) return 'makas'; if (!f.cornerLit) return 'corner'; if (!f.vidaTaken) return 'vida';
    if (!f.fixed) return 'lehim'; return 'ladder';
  }
  if (!f.pitSeen) return 'pit'; if (!f.gateOpen) return 'panel'; return 'gate';
}
function showHint() {
  const id = currentHint(); S.hint = { id, t: 3.2 };
  if (id === 'corner' || (id === 'lehim' && !S.f.vidaTaken)) say(['goz', 'karanlik']);
}

// ---------- input ----------
let drag = null, down = null;
function pt(e) { const r = C.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
function hsAt(p) { return (HS[S.scene] || []).find(h => (!h.on || h.on()) && inRect(p, h.r)); }
C.addEventListener('pointerdown', e => {
  e.preventDefault(); const p = pt(e); audioStart();
  if (S.mode === 'title') { S.mode = 'cin'; S.cin = { t: 0 }; musicBox(); return; }
  if (S.mode === 'cin') { S.cin.t = Math.max(S.cin.t, 9.2); return; }
  if (S.mode === 'end') { if (S.t > 2.5) location.reload(); return; }
  if (S.mode !== 'play' || S.fade > .2) return;
  if (S.overlay) { overlayDown(p); return; }
  if (inRect(p, [10, 10, 78, 78])) { showHint(); return; }
  for (let i = 0; i < S.inv.length; i++) if (inRect(p, slotRect(i))) { drag = { item: S.inv[i], x: p.x, y: p.y }; return; }
  if (L.anim) return;
  if (inRect(p, lehimBox())) { drag = { light: true, x: p.x, y: p.y, x0: p.x, y0: p.y }; return; }
  down = p;
});
C.addEventListener('pointermove', e => { if (drag) { const p = pt(e); drag.x = p.x; drag.y = p.y; } });
C.addEventListener('pointerup', e => {
  const p = pt(e);
  if (drag) {
    const d = drag; drag = null;
    if (d.light) {
      if (Math.hypot(p.x - d.x0, p.y - d.y0) < 24) { say(['kubbe']); return; }
      const h = hsAt(p);
      if (h && h.light) walkTo(h.stand[0], h.stand[1], () => h.light());
      else { say(['goz', 'soru'], 1.6); }
      return;
    }
    // item dropped
    for (let i = 0; i < S.inv.length; i++) if (inRect(p, slotRect(i)) && S.inv[i] !== d.item) { say(['x'], 1.2); bad(); return; }
    // Prefer a matching world target over Lehim when their hit areas overlap.
    // This lets an item dropped on an object work even when Lehim stands in front of it.
    const h = hsAt(p);
    if (h && h.use && h.use[d.item]) { walkTo(h.stand[0], h.stand[1], () => h.use[d.item]()); return; }
    if (inRect(p, lehimBox())) { useOnLehim(d.item); return; }
    if (h) { walkTo(h.stand[0], h.stand[1], () => { say(['x'], 1.3); bad(); }); }
    return;
  }
  if (!down) return; down = null;
  const h = hsAt(p);

});
function useOnLehim(item) {
  const f = S.f;

    takeItem('kol'); L.arm = true; clank(); play('dance', 1.4, () => { f.loose = 1; say(['kapak', 'vida', 'soru'], 3.2); bad(); }); return;
  }
  if (item === 'vida' && f.loose && !f.vidaOn) { takeItem('vida'); f.vidaOn = 1; clank(); say(['vida', 'makas'], 2.6); return; }
  if (item === 'makas' && f.vidaOn && !f.fixed) {
    f.fixed = 1; clank(); play('dance', 1.4); setTimeout(() => halo(L.x, L.y - 60, 200), 300); return;
  }
  if (item === 'makas' && f.loose && !f.vidaOn) { say(['vida', 'soru']); return; }
  say(['x'], 1.2); bad();
}

}
